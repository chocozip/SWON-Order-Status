
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매입사별 발주현황</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #f4f6fa;
  color: #333;
}

.container {
  max-width: 1400px;
  margin: auto;
}

/* 상단 */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: 25px;
}

.refresh-btn {
  background: #333;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 11px 16px;
  font-size: 14px;
  cursor: pointer;
}

/* 매입사 탭 */
.tabs {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}

.tab {
  background: white;
  border: 1px solid #ddd;
  color: #555;
  border-radius: 8px;
  padding: 12px 8px;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}

.tab.active {
  background: #333;
  color: white;
  border-color: #333;
}

/* 검색 및 정렬 */
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

input, select {
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  background: white;
  min-height: 44px;
}

input {
  flex: 1;
  min-width: 150px;
}

select {
  min-width: 160px;
}

/* PC 테이블 */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

table {
  width: 100%;
  min-width: 850px;
  border-collapse: collapse;
}

th {
  background: #f0f1f5;
  padding: 15px 10px;
  font-size: 13px;
  border-bottom: 1px solid #ddd;
  white-space: nowrap;
}

td {
  padding: 14px 10px;
  text-align: center;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}

tr:hover {
  background: #fafafa;
}

/* 진행상태 색상 */
.status {
  display: inline-block;
  padding: 6px 11px;
  border-radius: 6px;
  font-weight: bold;
  white-space: nowrap;
  font-size: 13px;
}

.status-order {
  background: #f8c9dc;
  color: #9b174e;
}

.status-delivered {
  background: #c8f0d1;
  color: #176b32;
}

.status-before {
  background: #ffd0d0;
  color: #b42323;
}

.status-soldout {
  background: #ffd0d0;
  color: #b42323;
}

/* 모바일 카드 */
.mobile-list {
  display: none;
}

.order-card {
  background: white;
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 9px;
  border: 1px solid #eceef2;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}

.card-line1 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}

.card-line2 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}

.card-line3 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  color: #777;
  font-size: 12px;
}

.card-product {
  font-size: 15px;
  font-weight: bold;
  line-height: 1.4;
  overflow-wrap: anywhere;
  flex: 1;
  min-width: 0;
}

.card-quantity {
  font-size: 13px;
  font-weight: bold;
  white-space: nowrap;
  color: #333;
}

.card-arrival {
  font-size: 13px;
  font-weight: bold;
  color: #333;
  white-space: nowrap;
}

.card-order-date {
  font-size: 12px;
  color: #888;
  white-space: nowrap;
}

.card-note {
  font-size: 12px;
  color: #777;
  overflow-wrap: anywhere;
  text-align: right;
  flex: 1;
  min-width: 0;
}

.empty, .loading, .error {
  padding: 40px;
  text-align: center;
  color: #888;
}

/* 모바일 */
@media (max-width: 700px) {

  body {
    padding: 10px;
  }

  .header {
    margin-bottom: 13px;
  }

  h1 {
    font-size: 19px;
  }

  .refresh-btn {
    padding: 9px 11px;
    font-size: 13px;
  }

  /* 매입사 탭 2줄 */
  .tabs {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 7px;
    margin-bottom: 13px;
  }

  .tab {
    width: 100%;
    padding: 10px 4px;
    font-size: 13px;
  }

  /* 검색 및 필터 */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-bottom: 12px;
  }

  .controls input {
    grid-column: 1 / -1;
    width: 100%;
    min-width: 0;
  }

  .controls select {
    width: 100%;
    min-width: 0;
    padding: 10px 7px;
    font-size: 13px;
  }

  /* PC 표 숨김 */
  .table-wrap {
    display: none;
  }

  /* 모바일 카드 표시 */
  .mobile-list {
    display: block;
  }

  .order-card {
    padding: 11px 12px;
    margin-bottom: 8px;
  }

  .card-line1 {
    margin-bottom: 6px;
  }

  .card-line2 {
    margin-bottom: 5px;
  }

  .card-product {
    font-size: 14px;
  }

  .card-quantity {
    font-size: 12px;
  }

  .card-arrival {
    font-size: 12px;
  }

  .status {
    font-size: 11px;
    padding: 5px 8px;
  }

  .empty, .loading, .error {
    padding: 30px 12px;
    background: white;
    border-radius: 10px;
  }
}

/* 아주 작은 화면 */
@media (max-width: 360px) {

  body {
    padding: 8px;
  }

  h1 {
    font-size: 17px;
  }

  .tab {
    font-size: 12px;
  }

  .order-card {
    padding: 10px;
  }

  .card-product {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📦 매입사별 발주현황</h1>

    <button class="refresh-btn" onclick="loadAll()">
      ↻ 새로고침
    </button>
  </div>

  <!-- 매입사 탭 -->
  <div class="tabs" id="tabs"></div>

  <!-- 검색 및 정렬 -->
  <div class="controls">

    <input
      type="text"
      id="searchInput"
      placeholder="상품명 또는 비고 검색"
      oninput="render()"
    >

    <select id="statusFilter" onchange="render()">
      <option value="">전체 진행상태</option>
      <option value="발주완료">발주완료</option>
      <option value="배송완료">배송완료</option>
      <option value="배송전">배송전</option>
      <option value="품절">품절</option>
    </select>

    <select id="sortFilter" onchange="render()">
      <option value="arrivalDesc">도착예정일순</option>
    </select>

  </div>

  <!-- PC 화면 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>진행상태</th>
          <th>발주일자</th>
          <th>상품명</th>
          <th>수량</th>
          <th>단위</th>
          <th>도착예정일</th>
          <th>비고</th>
        </tr>
      </thead>

      <tbody id="tableBody">
        <tr>
          <td colspan="7" class="loading">
            데이터를 불러오는 중입니다.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 모바일 화면 -->
  <div class="mobile-list" id="mobileList">
    <div class="loading">
      데이터를 불러오는 중입니다.
    </div>
  </div>

</div>

<script>

const SPREADSHEET_ID =
  "1XfJfi53u2t21jKdKJofoGyijiPOmkot76Z-NOmSRpaU";

const SHEETS = [
  "3M",
  "프린텍",
  "유니",
  "짐모아",
  "스테들러",
  "아톰",
  "파이롯트",
  "항소"
];

let currentSheet = "3M";
let allData = {};

/* 매입사 탭 생성 */
function createTabs() {

  const tabs = document.getElementById("tabs");

  tabs.innerHTML = "";

  SHEETS.forEach(sheet => {

    const button = document.createElement("button");

    button.className =
      "tab" + (sheet === currentSheet ? " active" : "");

    button.textContent = sheet;

    button.onclick = function() {

      currentSheet = sheet;

      createTabs();
      render();

    };

    tabs.appendChild(button);

  });

}

/* 날짜 처리 */
function formatDate(value) {

  if (!value) return "";

  if (typeof value === "string") {

    const match = value.match(
      /Date\((\d+),(\d+),(\d+)\)/
    );

    if (match) {

      const year = Number(match[1]);
      const month = Number(match[2]) + 1;
      const day = Number(match[3]);

      return `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    }

    return value;

  }

  return value;

}

/* 셀 값 가져오기 */
function getValue(cell) {

  if (!cell) return "";

  if (cell.f !== undefined && cell.f !== null) {
    return cell.f;
  }

  if (cell.v !== undefined && cell.v !== null) {
    return formatDate(cell.v);
  }

  return "";

}

/* 상태별 색상 */
function getStatusClass(status) {

  const value = String(status).trim();

  switch (value) {

    case "발주완료":
      return "status-order";

    case "배송완료":
      return "status-delivered";

    case "배송전":
      return "status-before";

    case "품절":
      return "status-soldout";

    default:
      return "";

  }

}

/* HTML 보안 처리 */
function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

/* 날짜 정렬용 숫자 변환 */
function dateToNumber(value) {

  if (!value) return null;

  const text = String(value).trim();

  // YYYY-MM-DD / YYYY.MM.DD / YYYY/MM/DD
  const match = text.match(
    /^(\d{4})[./-](\d{1,2})[./-](\d{1,2})/
  );

  if (match) {

    return (
      Number(match[1]) * 10000 +
      Number(match[2]) * 100 +
      Number(match[3])
    );

  }

  // YYYYMMDD
  if (/^\d{8}$/.test(text)) {
    return Number(text);
  }

  // 그 외 날짜 형식
  const timestamp = Date.parse(text);

  if (!Number.isNaN(timestamp)) {

    const date = new Date(timestamp);

    return (
      date.getFullYear() * 10000 +
      (date.getMonth() + 1) * 100 +
      date.getDate()
    );

  }

  return null;

}

/* 구글 시트 데이터 불러오기 */
function loadSheet(sheetName) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "googleSheetCallback_" +
      Date.now() +
      "_" +
      Math.random().toString(36).substring(2);

    const script = document.createElement("script");

    const timeout = setTimeout(() => {

      cleanup();

      reject(new Error("데이터 불러오기 시간 초과"));

    }, 15000);

    function cleanup() {

      clearTimeout(timeout);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

    }

    window[callbackName] = function(response) {

      cleanup();

      try {

        if (
          !response ||
          !response.table ||
          !response.table.rows
        ) {

          reject(new Error("시트 데이터를 읽을 수 없습니다."));
          return;

        }

        const rows = response.table.rows;

        const data = rows.map(row => {

          const cells = row.c || [];

          return {

            status: getValue(cells[0]),
            orderDate: getValue(cells[1]),
            product: getValue(cells[2]),
            quantity: getValue(cells[3]),
            unit: getValue(cells[4]),
            arrivalDate: getValue(cells[5]),
            note: getValue(cells[6])

          };

        }).filter(item => {

          return (
            item.status ||
            item.orderDate ||
            item.product ||
            item.quantity ||
            item.note
          );

        });

        resolve(data);

      } catch (error) {

        reject(error);

      }

    };

    const url =
      `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=out:json;responseHandler:${callbackName}`;

    script.src = url;

    script.onerror = function() {

      cleanup();

      reject(new Error("구글 시트 연결에 실패했습니다."));

    };

    document.body.appendChild(script);

  });

}

/* 전체 데이터 불러오기 */
async function loadAll() {

  document.getElementById("tableBody").innerHTML = `
    <tr>
      <td colspan="7" class="loading">
        데이터를 불러오는 중입니다.
      </td>
    </tr>
  `;

  document.getElementById("mobileList").innerHTML = `
    <div class="loading">데이터를 불러오는 중입니다.</div>
  `;

  try {

    const results = await Promise.all(
      SHEETS.map(sheet => loadSheet(sheet))
    );

    SHEETS.forEach((sheet, index) => {
      allData[sheet] = results[index];
    });

    render();

  } catch (error) {

    const message = escapeHTML(error.message);

    document.getElementById("tableBody").innerHTML = `
      <tr>
        <td colspan="7" class="error">
          데이터를 불러오지 못했습니다.<br>
          ${message}
        </td>
      </tr>
    `;

    document.getElementById("mobileList").innerHTML = `
      <div class="error">
        데이터를 불러오지 못했습니다.<br>
        ${message}
      </div>
    `;

    console.error(error);

  }

}

/* 도착예정일 늦은 순 정렬 */
function sortData(data) {

  return data.sort((a, b) => {

    const dateA = dateToNumber(a.arrivalDate);
    const dateB = dateToNumber(b.arrivalDate);

    // 날짜가 없는 항목은 마지막
    if (dateA === null && dateB === null) return 0;
    if (dateA === null) return 1;
    if (dateB === null) return -1;

    return dateB - dateA;

  });

}

/* 화면 출력 */
function render() {

  const tbody = document.getElementById("tableBody");
  const mobileList = document.getElementById("mobileList");

  let data = [...(allData[currentSheet] || [])];

  const search =
    document.getElementById("searchInput")
      .value.trim().toLowerCase();

  const statusFilter =
    document.getElementById("statusFilter").value;

  // 검색 및 상태 필터
  data = data.filter(item => {

    const searchTarget =
      `${item.product} ${item.note}`.toLowerCase();

    const matchesSearch =
      !search || searchTarget.includes(search);

    const matchesStatus =
      !statusFilter ||
      String(item.status).trim() === statusFilter;

    return matchesSearch && matchesStatus;

  });

  // 도착예정일 늦은 순
  data = sortData(data);

  if (data.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          조회된 발주 내역이 없습니다.
        </td>
      </tr>
    `;

    mobileList.innerHTML = `
      <div class="empty">
        조회된 발주 내역이 없습니다.
      </div>
    `;

    return;

  }

  /* PC 표 출력 */
  tbody.innerHTML = data.map(item => {

    const statusClass = getStatusClass(item.status);

    return `
      <tr>

        <td>
          <span class="status ${statusClass}">
            ${escapeHTML(item.status)}
          </span>
        </td>

        <td>${escapeHTML(item.orderDate)}</td>

        <td style="text-align:left;">
          ${escapeHTML(item.product)}
        </td>

        <td>${escapeHTML(item.quantity)}</td>

        <td>${escapeHTML(item.unit)}</td>

        <td>${escapeHTML(item.arrivalDate)}</td>

        <td>${escapeHTML(item.note)}</td>

      </tr>
    `;

  }).join("");

  /* 모바일 간소화 카드 출력 */
  mobileList.innerHTML = data.map(item => {

    const statusClass = getStatusClass(item.status);

    return `
      <div class="order-card">

        <!-- 첫 번째 줄: 상태 + 도착예정일 -->
        <div class="card-line1">

          <span class="status ${statusClass}">
            ${escapeHTML(item.status || "-")}
          </span>

          <span class="card-arrival">
            도착 ${escapeHTML(item.arrivalDate || "-")}
          </span>

        </div>

        <!-- 두 번째 줄: 상품명 + 수량 -->
        <div class="card-line2">

          <div class="card-product">
            ${escapeHTML(item.product || "상품명 없음")}
          </div>

          <div class="card-quantity">
            ${escapeHTML(item.quantity || "-")}
            ${escapeHTML(item.unit || "")}
          </div>

        </div>

        <!-- 세 번째 줄: 발주일 + 비고 -->
        <div class="card-line3">

          <span class="card-order-date">
            발주 ${escapeHTML(item.orderDate || "-")}
          </span>

          ${
            item.note
              ? `
                <span class="card-note">
                  ${escapeHTML(item.note)}
                </span>
              `
              : ""
          }

        </div>

      </div>
    `;

  }).join("");

}

/* 최초 실행 */
createTabs();
loadAll();

/* 60초마다 자동 새로고침 */
setInterval(loadAll, 60000);

</script>

</body>
</html>
